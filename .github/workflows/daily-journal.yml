name: Submit Daily Journal

on:
  schedule:
    # 4:30 PM IST (16:30 IST) every day.
    # In UTC, 16:30 IST is 11:00 UTC.
    # To avoid GitHub Actions minute :00 congestion delays (which can delay runs by 5+ hours),
    # schedule at 10:55 UTC (16:25 IST) off-peak; daily_fill.py will wait until 16:30 IST.
    - cron: '55 10 * * *'
    # Fallback retry at 11:05 UTC (16:35 IST) in case the first trigger is delayed or skipped
    - cron: '5 11 * * *'
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run unit tests
        run: python -m unittest -v test_daily_fill.py

      - name: Run Daily Journal Submission
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_EMAIL: ${{ secrets.EXPECTED_EMAIL }}
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
        run: |
          python daily_fill.py --auto --submit

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: submit-failure
          path: submit_failure.png
          if-no-files-found: ignore
